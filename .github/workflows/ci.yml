name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BITCOIN_VERSION: "29.2"
  BITCOIN_SHA256: 1fd58d0ae94b8a9e21bbaeab7d53395a44976e82bd5492b0a894826c135f9009

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safrod
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safrod" --health-interval 5s --health-retries 10
    env:
      # sqlx::test creates a throwaway database per test from this server.
      DATABASE_URL: postgres://safrod@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  merchant-app:
    name: Example merchant app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
        working-directory: examples/merchant

  dependencies:
    name: Dependency advisories and licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  regtest:
    name: Regtest end-to-end demos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safrod
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safrod" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Bitcoin Core
        run: |
          curl -fsSL -o bitcoin.tgz "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "${BITCOIN_SHA256}  bitcoin.tgz" | sha256sum -c -
          tar -xzf bitcoin.tgz
          echo "BITCOIN_BIN=$PWD/bitcoin-${BITCOIN_VERSION}/bin" >> "$GITHUB_ENV"
      - name: Build the daemon
        run: cargo build --locked -p safrod
      - name: Start regtest, two Safrod nodes and the merchant app
        run: scripts/dev-native.sh start
        env:
          SAFROD_DEV_PG_URL: postgres://safrod@127.0.0.1:5432
      - name: Fund nodes, open a channel, register the webhook
        run: scripts/setup.sh
      - name: Run the demos
        run: scripts/demo.sh all
      - name: Collect logs
        if: failure()
        run: tail -n 200 .demo/native/*.log
      - name: Stop
        if: always()
        run: scripts/dev-native.sh stop
        env:
          SAFROD_DEV_PG_URL: postgres://safrod@127.0.0.1:5432
