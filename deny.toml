# Checked in CI with cargo-deny. Licenses were enumerated from `cargo metadata`
# for the locked dependency set; add to this list only after reading the
# license, not to make a failure go away.
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    # rust-bitcoin helper crates (bip21, hex_lit): MIT with a no-false-attribution clause.
    "MITNFA",
    # webpki-roots 0.25 (via the legacy settlement prototype's TLS stack): file-level
    # copyleft, used unmodified as a dependency.
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
